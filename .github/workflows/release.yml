name: Release binaries
run-name: Release binaries from ${{ github.ref_name }} (${{ github.sha }})

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['package.json']

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    outputs:
      shouldRelease: ${{ steps.metadata.outputs.shouldRelease }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check version and existing release
        id: metadata
        run: npx --no-install tsx scripts/release/index.ts
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs: prepare
    if: needs.prepare.outputs.shouldRelease == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build:
    needs: [prepare, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, platform: linux, arch: x64, extension: '' }
          - { runner: ubuntu-22.04-arm, platform: linux, arch: arm64, extension: '' }
          - { runner: macos-15-intel, platform: darwin, arch: x64, extension: '' }
          - { runner: macos-15, platform: darwin, arch: arm64, extension: '' }
          - { runner: windows-2022, platform: win32, arch: x64, extension: .exe }
          - { runner: windows-11-arm, platform: win32, arch: arm64, extension: .exe }
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Build and verify standalone binary
        run: |
          npm run build:binary
          npm run verify:binary -- "dist/release/agent-gateway-${RELEASE_TAG#v}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.extension }}"
      - name: Build and verify AppImage
        if: matrix.platform == 'linux'
        run: |
          binary="dist/release/agent-gateway-${RELEASE_TAG#v}-linux-${{ matrix.arch }}"
          npm run build:appimage -- "$binary"
          appimage="$GITHUB_WORKSPACE/$binary.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help
          mkdir -p .tmp/appimage-smoke
          cd .tmp/appimage-smoke
          "$appimage" --appimage-extract > extract.log
          cd "$GITHUB_WORKSPACE"
          npm run verify:binary -- .tmp/appimage-smoke/squashfs-root/AppRun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [prepare, test, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/release
      - name: Publish complete release
        run: npx --no-install tsx scripts/release/publishRelease.ts
        env:
          GH_TOKEN: ${{ github.token }}
